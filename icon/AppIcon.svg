<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- notepanel's app icon, on Apple's macOS icon grid: an 824 px squircle centered on a 1024 px
     canvas. The squircle stays opaque, or macOS 26 shows the icon shrunk on a gray tile.
     AppIcon.icns is made from this file on a Mac (brew install librsvg):
       mkdir AppIcon.iconset
       for s in 16 32 128 256 512; do
         rsvg-convert -w $s AppIcon.svg -o AppIcon.iconset/icon_${s}x$s.png
         rsvg-convert -w $((s * 2)) AppIcon.svg -o AppIcon.iconset/icon_${s}x$s@2x.png
       done
       iconutil -c icns AppIcon.iconset && rm -r AppIcon.iconset -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8EC5FF"/>
      <stop offset="1" stop-color="#3F7FE6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
