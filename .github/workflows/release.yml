name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub and Homebrew releases
    runs-on: xcode-27
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out the source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out the Homebrew tap
        uses: actions/checkout@v7
        with:
          repository: kkensuke/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Verify the release tag
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-list -n 1 "$RELEASE_TAG")" origin/main

          app_version="$(sed -n 's/^version="\([^"]*\)".*/\1/p' scripts/bundle.sh)"
          if [[ "${RELEASE_TAG#v}" != "$app_version" ]]; then
            echo "tag $RELEASE_TAG does not match version $app_version in scripts/bundle.sh" >&2
            exit 1
          fi

      - name: Build the app
        run: |
          swift run NotepanelChecks
          ARCHS="arm64 x86_64" scripts/bundle.sh
          ditto -c -k --keepParent build/notepanel.app "notepanel-${RELEASE_TAG#v}.zip"

      - name: Create the GitHub release
        run: |
          zip="notepanel-${RELEASE_TAG#v}.zip"
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG" --verify-tag
          fi
          # On a rerun the zip already there stays, since the cask must match the published file.
          if ! gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qxF "$zip"; then
            gh release upload "$RELEASE_TAG" "$zip"
          fi
          gh release download "$RELEASE_TAG" --pattern "$zip" --dir "$RUNNER_TEMP/release"

      - name: Publish the Homebrew cask
        working-directory: homebrew-tap
        run: |
          version="${RELEASE_TAG#v}"
          sha256="$(shasum -a 256 "$RUNNER_TEMP/release/notepanel-$version.zip" | cut -d ' ' -f 1)"
          mkdir -p Casks
          cat > Casks/notepanel.rb <<EOF
          # This file is generated by kkensuke/notepanel. Do not edit it manually.
          cask "notepanel" do
            version "$version"
            sha256 "$sha256"

            url "https://github.com/kkensuke/notepanel/releases/download/v#{version}/notepanel-#{version}.zip"
            name "notepanel"
            desc "Floating notepad that opens over any app"
            homepage "https://github.com/kkensuke/notepanel"

            depends_on macos: :sonoma

            app "notepanel.app"

            # The app is signed ad hoc, not notarized, so Gatekeeper would block it while it is quarantined.
            postflight_steps do
              run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{appdir}}/notepanel.app"]
            end

            uninstall quit: "io.github.kkensuke.notepanel"

            # The notes folder (by default ~/Library/Application Support/notepanel/Notes) is left alone.
            zap trash: [
              "~/Library/Application Support/notepanel/Backups",
              "~/Library/Preferences/io.github.kkensuke.notepanel.plist",
            ]
          end
          EOF
          git diff --check -- Casks/notepanel.rb
          git add Casks/notepanel.rb
          if git diff --cached --quiet -- Casks/notepanel.rb; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "notepanel $version"
          git push origin HEAD:main
