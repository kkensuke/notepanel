<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="editor"></div>
  <footer id="footer">
    <span id="status" role="status"></span>
    <span id="count"></span>
  </footer>
  <div id="switcher" hidden>
    <div class="box">
      <input id="query" type="text" placeholder="Search notes" aria-label="Search notes"
             aria-controls="results" autocomplete="off" spellcheck="false">
      <ul id="results" role="listbox" aria-label="Notes"></ul>
    </div>
  </div>
  <div id="history" hidden tabindex="-1" role="listbox" aria-label="Earlier versions">
    <div class="box">
      <ul id="versions"></ul>
      <pre id="version"></pre>
    </div>
  </div>
  <script src="editor.js"></script>
</body>
</html>
