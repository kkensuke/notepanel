<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="editor"></div>
  <footer id="footer">
    <span id="status" role="status"></span>
    <span id="count"></span>
  </footer>
  <div id="switcher" hidden>
    <div class="sheet">
      <label class="field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>
        <input id="query" type="text" placeholder="Search notes" aria-label="Search notes"
               aria-controls="results" autocomplete="off" spellcheck="false">
        <span id="total" role="status"></span>
      </label>
      <ul id="results" role="listbox" aria-label="Notes" tabindex="-1"></ul>
    </div>
  </div>
  <div id="history" hidden tabindex="-1" role="listbox" aria-label="Earlier versions">
    <div class="box">
      <ul id="versions"></ul>
      <pre id="version"></pre>
    </div>
  </div>
  <script src="editor.js"></script>
</body>
</html>
